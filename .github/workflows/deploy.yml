name: Docker Deployment

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/neezamiya-insti/nestick_portfolio_handler:latest

      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      STORAGE_PATH: ${{ secrets.STORAGE_PATH }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}" \
            -t $IMAGE_NAME .

      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME

      - name: Connect to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            echo "✅ Connected to VPS"
            hostname
            whoami
            pwd

            echo "🔐 Logging into GHCR..."

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            echo "✅ GHCR Login Successful"

            echo "📥 Pulling latest Docker image..."

            docker pull ghcr.io/neezamiya-insti/nestick_portfolio_handler:latest

            echo "✅ Docker image pulled successfully"

            docker logout ghcr.io

            echo "👋 Logged out from GHCR"

            echo "🛑 Stopping old container..."
            docker stop PSM_neezamiya || true

            echo "🗑 Removing old container..."
            docker rm PSM_neezamiya || true

            echo "🚀 Running new container..."

            docker run -d \
              --name PSM_neezamiya \
              --restart unless-stopped \
              -p 3001:3000 \
              -e DB_HOST="${{ secrets.DB_HOST }}" \
              -e DB_USER="${{ secrets.DB_USER }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e DB_NAME="${{ secrets.DB_NAME }}" \
              -e EMAIL_PASS="${{ secrets.EMAIL_PASS }}" \
              -e STORAGE_PATH="${{ secrets.STORAGE_PATH }}" \
              ghcr.io/neezamiya-insti/nestick_portfolio_handler:latest

            echo "⏳ Waiting for application to start..."
            sleep 20

            echo "❤️ Checking Docker Health..."

            HEALTH=$(docker inspect --format='{{.State.Health.Status}}' PSM_neezamiya)

            echo "Docker Health: $HEALTH"

            if [ "$HEALTH" != "healthy" ]; then
              echo "❌ Docker Health Check Failed"
              docker logs PSM_neezamiya
              exit 1
            fi

            echo "🌐 Verifying API Health..."

            if curl -fs http://localhost:3001/api/health > /dev/null; then
              echo "✅ Application is Live"
            else
              echo "❌ Application Health Check Failed"
              docker logs PSM_neezamiya
              exit 1
            fi

            echo "📦 Running Containers"
            docker ps

            echo "🎉 Deployment Completed Successfully"