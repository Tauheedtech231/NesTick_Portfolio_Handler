<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Handwritten Diagram Reproduction</title>
<!-- Load Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="typography">
    /* Using a handwriting-style font to mimic the sketch */
    @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap');
    
    .handwritten-text {
      font-family: 'Architects+Daughter', cursive;
      color: #1e293b; /* Slate 800 */
      pointer-events: none;
      line-height: 1.2;
    }
  </style>
<style data-purpose="layout">
    .diagram-container {
      position: relative;
      width: 500px;
      height: 500px;
    }
    
    /* Using SVG for precise geometric reproduction of the sketch lines */
    svg {
      width: 100%;
      height: 100%;
    }

    .sketch-line {
      fill: none;
      stroke: #1e293b;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
<!-- END: Custom Styles -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;display=swap" data-snapdom="injected-import"></head>
<body class="bg-white flex items-center justify-center min-h-screen">
<!-- BEGIN: Main Diagram Container -->
<main class="diagram-container" data-purpose="diagram-wrapper">
<!-- SVG Layer for Circle and Segment Divisions -->
<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
<!-- Main Outer Circle -->
<circle class="sketch-line" cx="250" cy="250" r="230"></circle>
<!-- Top Left to Center Line (Road to made Portfolio area) -->

<!-- Top Right Partition (Multiportal area) -->
<line class="sketch-line" x1="250" x2="160" y1="20" y2="155"></line>
<!-- Central Partition Top Line -->
<line class="sketch-line" x1="160" x2="330" y1="155" y2="210"></line>
<!-- Central Partition Bottom Line (Closing the 'Centraliz' box) -->
<line class="sketch-line" x1="120" x2="210" y1="260" y2="330"></line>
<line class="sketch-line" x1="210" x2="480" y1="330" y2="250"></line>
<!-- Connecting Vertical/Diagonal Inner Lines -->
<line class="sketch-line" x1="160" x2="120" y1="155" y2="260"></line>
<line class="sketch-line" x1="330" x2="480" y1="210" y2="250"></line>
<!-- Left Boundary Line for bottom segments -->
<line class="sketch-line" x1="20" x2="120" y1="310" y2="260"></line>
<!-- Bottom Vertical Dividers -->
<line class="sketch-line" x1="210" x2="130" y1="330" y2="465"></line>
<line class="sketch-line" x1="210" x2="310" y1="330" y2="475"></line>
<!-- Right Side Arrow pointing inwards -->


</svg>
<!-- BEGIN: Text Labels Overlay -->
<!-- Positioned absolutely to match handwriting placement in the provided image -->
<!-- Top Left Label -->
<div class="absolute top-[50px] left-[60px] handwritten-text text-xl -rotate-12 text-center" data-purpose="label">
      Road to made<br>Portfolio
    </div>
<!-- Top Right Label -->
<div class="absolute top-[80px] left-[230px] handwritten-text text-xl rotate-12" data-purpose="label">
      Multiportal
    </div>
<!-- Center Label -->
<div class="absolute top-[185px] left-[175px] handwritten-text text-lg" data-purpose="label">
      Centraliz
    </div>
<!-- Bottom Left Markings -->
<div class="absolute bottom-[170px] left-[120px] handwritten-text text-2xl font-bold" data-purpose="markings">
      - -
    </div>
<!-- Bottom Middle Markings -->
<div class="absolute bottom-[70px] left-[160px] handwritten-text text-2xl font-bold -rotate-12" data-purpose="markings">
      - -
    </div>
<!-- Bottom Right Markings -->
<div class="absolute bottom-[100px] left-[290px] handwritten-text text-2xl font-bold rotate-12" data-purpose="markings">
      - -
    </div>
<!-- END: Text Labels Overlay -->
</main>
<!-- END: Main Diagram Container -->


</body></html>
