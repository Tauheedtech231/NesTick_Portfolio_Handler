<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>PSM - Building Digital Futures</title>
<!-- Tailwind CSS v3 CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'deep-navy': '#020b1c',
            'brand-blue': '#4a9eff',
            'brand-yellow': '#ffb400',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
<!-- Custom styles for specific effects that Tailwind might need help with -->
<style data-purpose="animations">
    @keyframes rotate-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-orbit {
      animation: rotate-slow 20s linear infinite;
    }
    .glow-blue {
      box-shadow: 0 0 40px rgba(74, 158, 255, 0.2);
    }
    .glow-yellow-dot {
      box-shadow: 0 0 10px rgba(255, 180, 0, 0.8);
    }
  </style>
</head>
<body class="bg-deep-navy text-white min-h-screen font-sans">
<!-- BEGIN: MainHeader -->
<header class="p-6 flex justify-between items-center fixed top-0 w-full z-50">
<div class="w-10 h-10 rounded-full border border-gray-700 flex items-center justify-center bg-black/40 backdrop-blur-md" data-purpose="nav-logo">
<span class="text-white font-bold text-lg">N</span>
</div>
<!-- Placeholder for potential mobile menu toggle -->
<div class="hidden"></div>
</header>
<!-- END: MainHeader -->
<main class="pt-24 pb-12 px-6 flex flex-col items-center">
<!-- BEGIN: HeroTextSection -->
<section class="w-full max-w-md mb-12" data-purpose="hero-content">
<div class="flex items-center gap-2 mb-6">
<span class="w-1 h-4 bg-gray-500 rounded-full"></span>
<span class="text-xs uppercase tracking-widest text-gray-400 font-semibold">About Us</span>
</div>
<h1 class="text-5xl md:text-6xl font-black leading-tight mb-4 px-2">
        Building<br>
<span class="text-brand-yellow">Digital</span><br>
<span class="text-brand-blue">Futures</span>
</h1>
<div class="flex items-center gap-4 mb-8">
<div class="h-[1px] w-12 bg-gray-600"></div>
<span class="text-[10px] tracking-[0.3em] text-gray-400 font-bold">SINCE 2021</span>
<div class="h-[1px] w-12 bg-gray-600"></div>
</div>
<p class="text-gray-400 text-base leading-relaxed max-w-[300px]">
        We empower institutions to manage and showcase College portfolios — 
        <span class="text-brand-yellow italic font-bold">simply, securely and efficiently.</span>
</p>
<div class="mt-10">
<button class="group flex items-center gap-4 px-6 py-4 rounded-full border border-gray-700 bg-black/20 hover:bg-white/5 transition-all duration-300">
<span class="text-sm font-bold tracking-wide">Explore Our Solutions</span>
<div class="w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center group-hover:bg-brand-blue transition-colors">
<svg class="h-4 w-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</button>
</div>
</section>
<!-- END: HeroTextSection -->
<!-- BEGIN: OrbitalUI -->
<section class="relative w-full aspect-square max-w-[400px] flex items-center justify-center mt-8" data-purpose="orbital-visual">
<!-- Outer Orbit Rings -->
<div class="absolute w-full h-full border border-blue-900/30 rounded-full"></div>
<div class="absolute w-[80%] h-[80%] border border-blue-900/20 rounded-full"></div>
<div class="absolute w-[60%] h-[60%] border border-dashed border-blue-500/10 rounded-full"></div>
<!-- Central PSM Logo Sphere -->
<div class="relative z-10 w-32 h-32 rounded-full flex items-center justify-center bg-gradient-to-br from-blue-900 to-black glow-blue border border-blue-500/30">
<div class="text-3xl font-black italic tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-brand-yellow to-brand-blue">
          PSM
        </div>
<!-- Inner glow effect -->
<div class="absolute inset-2 rounded-full border border-blue-400/20"></div>
</div>
<!-- Animated Rotating Container for Orbiting Elements -->
<div class="absolute w-full h-full animate-orbit">
<!-- Feature 1: Secure & Reliable -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<div class="w-10 h-10 rounded-lg border border-blue-500/50 bg-black/80 flex items-center justify-center mb-2">
<svg class="h-5 w-5 text-brand-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<span class="text-[8px] font-bold tracking-[0.2em] text-center uppercase text-gray-300">Secure &amp;<br>Reliable</span>
</div>
<!-- Feature 2: Data Driven Insights -->
<div class="absolute top-1/2 right-0 translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<div class="w-10 h-10 rounded-lg border border-blue-500/50 bg-black/80 flex items-center justify-center mb-2">
<svg class="h-5 w-5 text-brand-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<span class="text-[8px] font-bold tracking-[0.2em] text-center uppercase text-gray-300">Data Driven<br>Insights</span>
</div>
<!-- Feature 3: Global Presence -->
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-1/2 flex flex-col items-center">
<div class="w-10 h-10 rounded-lg border border-blue-500/50 bg-black/80 flex items-center justify-center mb-2">
<svg class="h-5 w-5 text-brand-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<span class="text-[8px] font-bold tracking-[0.2em] text-center uppercase text-gray-300">Global<br>Presence</span>
</div>
<!-- Feature 4: Smart Portfolios -->
<div class="absolute top-1/2 left-0 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<div class="w-10 h-10 rounded-lg border border-blue-500/50 bg-black/80 flex items-center justify-center mb-2">
<svg class="h-5 w-5 text-brand-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<span class="text-[8px] font-bold tracking-[0.2em] text-center uppercase text-gray-300">Smart<br>Portfolios</span>
</div>
<!-- Moving Yellow Dot -->
<div class="absolute top-[40%] left-[10%] w-2 h-2 bg-brand-yellow rounded-full glow-yellow-dot"></div>
</div>
<!-- Static Decorative Stars/Dots -->
<div class="absolute top-10 right-10 w-1 h-1 bg-blue-400 rounded-full"></div>
<div class="absolute bottom-20 left-20 w-1 h-1 bg-blue-300 rounded-full opacity-50"></div>
<div class="absolute top-1/4 left-5 w-0.5 h-0.5 bg-white rounded-full opacity-30"></div>
</section>
<!-- END: OrbitalUI -->
</main>
<!-- BEGIN: FooterDecoration -->
<footer class="fixed bottom-0 left-0 w-full p-4 pointer-events-none opacity-20">
<div class="flex justify-center space-x-1">
<div class="w-1 h-1 bg-blue-500 rounded-full"></div>
<div class="w-1 h-1 bg-blue-500 rounded-full"></div>
<div class="w-1 h-1 bg-blue-500 rounded-full"></div>
</div>
</footer>
<!-- END: FooterDecoration -->


</body></html>
