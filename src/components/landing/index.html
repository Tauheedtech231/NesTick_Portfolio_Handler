<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Handler - About Us Hero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandDark: '#0B0F19',
            brandYellow: '#FACC15',
          }
        }
      }
    }
  </script>
  <style>
    /* Smooth floating animation for elements */
    @keyframes float-slow {
      0%, 100% { transform: translateY(0px) rotate(-6deg); }
      50% { transform: translateY(-12px) rotate(-4deg); }
    }
    @keyframes float-faster {
      0%, 100% { transform: translateY(0px) rotate(8deg); }
      50% { transform: translateY(-15px) rotate(10deg); }
    }
    .animate-float-1 {
      animation: float-slow 6s ease-in-out infinite;
    }
    .animate-float-2 {
      animation: float-faster 7s ease-in-out infinite;
    }
    /* Rotating orbit line */
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spin-slow 25s linear infinite;
    }
  </style>
</head>
<body class="bg-brandDark font-sans antialiased text-slate-200 selection:bg-brandYellow selection:text-brandDark">

  <section class="relative min-h-screen w-full flex flex-col items-center justify-between overflow-hidden px-6 py-12 md:px-12 lg:px-24 select-none">
    
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-blue-500/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-10 right-10 w-[300px] h-[300px] bg-brandYellow/5 rounded-full blur-[100px] pointer-events-none"></div>

    <div class="w-full flex justify-start items-center z-10">
      <div class="inline-flex items-center gap-2 border border-brandYellow/20 bg-brandYellow/5 px-4 py-1.5 rounded-full text-xs font-semibold text-brandYellow tracking-wide backdrop-blur-sm shadow-[0_0_15px_rgba(250,204,21,0.05)]">
        <span>✧</span> Since 2021 <span>✧</span>
      </div>
    </div>

    <div class="relative w-full max-w-4xl flex items-center justify-center my-auto z-10 min-h-[350px] md:min-h-[450px]">
      
      <div class="absolute w-[320px] md:w-[540px] h-[140px] md:h-[200px] border border-brandYellow/20 rounded-full -rotate-12 blur-[1px] animate-spin-slow"></div>
      
      <div class="relative z-20 transform hover:scale-[1.01] transition-transform duration-700 ease-out p-4">
        <img 
          src="hero-illustration.png" 
          alt="Portfolio Handler Workspace" 
          class="w-full max-w-2xl h-auto object-contain drop-shadow-[0_25px_50px_rgba(0,0,0,0.6)]"
          onerror="this.style.display='none';"
        />
        
        <div class="absolute top-12 -left-6 md:left-0 w-36 h-44 bg-white/5 border border-white/10 backdrop-blur-md rounded-xl p-3 shadow-2xl animate-float-1">
          <div class="w-8 h-8 rounded-full bg-slate-700/80 mb-3"></div>
          <div class="w-full h-2 bg-white/20 rounded mb-2"></div>
          <div class="w-3/4 h-2 bg-white/10 rounded"></div>
        </div>
        
        <div class="absolute top-6 -right-6 md:right-0 w-40 h-48 bg-white/5 border border-white/10 backdrop-blur-md rounded-xl p-3 shadow-2xl animate-float-2">
          <div class="w-full h-20 bg-slate-800/80 rounded-lg mb-3"></div>
          <div class="w-full h-2 bg-white/20 rounded mb-2"></div>
          <div class="w-1/2 h-2 bg-white/10 rounded"></div>
        </div>
      </div>
    </div>

    <div class="w-full max-w-3xl text-center z-10 flex flex-col items-center mt-auto">
      
      <span class="text-brandYellow uppercase tracking-[0.2em] text-xs font-bold mb-3 block opacity-90">
        About Us
      </span>
      
      <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold text-white tracking-tight leading-[1.15] mb-4">
        Building Digital Futures
      </h1>
      
      <p class="text-slate-400 text-sm md:text-base lg:text-lg max-w-2xl font-normal leading-relaxed mb-6 opacity-80">
        Helping institutions manage and showcase student portfolios — simply and efficiently.
      </p>

      <div class="absolute bottom-16 right-[12%] text-slate-600 opacity-40 animate-pulse">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0L14.6 9.4L24 12L14.6 14.6L12 24L9.4 14.6L0 12L9.4 9.4L12 0Z" />
        </svg>
      </div>
      <div class="absolute bottom-28 left-[10%] text-slate-700 opacity-30 scale-75">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0L14.6 9.4L24 12L14.6 14.6L12 24L9.4 14.6L0 12L9.4 9.4L12 0Z" />
        </svg>
      </div>

    </div>
  </section>

</body>
</html>
