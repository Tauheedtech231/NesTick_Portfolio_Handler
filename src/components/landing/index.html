
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.cards-wrap {
  display: grid;
  grid-template-columns: 1fr 1px 1fr 1px 1fr;
  background: #f5f5f7;
  border-radius: 12px;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
}
.divider-v { background: #ddd; }
.card {
  background: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 28px;
}
.photo-area {
  width: 100%;
  height: 260px;
  position: relative;
  overflow: hidden;
  background: #fff;
}
.parallelogram {
  position: absolute;
  bottom: 0;
  right: -10px;
  width: 220px;
  height: 220px;
  background: #8800ff;
  clip-path: polygon(30% 0%, 100% 0%, 70% 100%, 0% 100%);
}
.person-img {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  height: 245px;
  width: auto;
  object-fit: contain;
  z-index: 2;
}
.avatar-placeholder {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  height: 240px;
}
.avatar-silhouette {
  width: 130px;
  height: 200px;
}
.person-name {
  font-size: 15px;
  font-weight: 700;
  color: #111;
  text-align: center;
  margin-top: 18px;
  margin-bottom: 6px;
  padding: 0 16px;
}
.person-role {
  font-size: 13px;
  color: #888;
  text-align: center;
  font-weight: 400;
}
</style>
