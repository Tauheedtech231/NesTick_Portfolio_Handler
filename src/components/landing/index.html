<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Handler Navbar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a2540;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .navbar-wrapper {
    width: 100%;
    max-width: 1280px;
    background: #0f1b35;
    border-radius: 18px;
    padding: 10px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    box-shadow: 0 4px 40px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  /* Yellow curve accent on left */
  .navbar-wrapper::before {
    content: '';
    position: absolute;
    left: 195px;
    top: -2px;
    bottom: -2px;
    width: 32px;
    border-right: 3px solid #f5c518;
    border-radius: 0 50% 50% 0 / 0 24px 24px 0;
    pointer-events: none;
    z-index: 2;
  }

  /* Logo section */
  .logo-section {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 160px;
  }

  .logo-icon {
    width: 48px;
    height: 48px;
    background: white;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }

  .logo-icon svg {
    width: 36px;
    height: 36px;
  }

  .logo-text {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }

  .logo-text .portfolio {
    font-size: 14px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.3px;
  }

  .logo-text .handler {
    font-size: 16px;
    font-weight: 700;
    color: #f5c518;
    letter-spacing: 0.3px;
  }

  /* Nav Links */
  .nav-links {
    display: flex;
    align-items: center;
    gap: 0;
    flex: 1;
    padding-left: 48px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 0;
  }

  .nav-link {
    font-size: 13px;
    font-weight: 600;
    color: #a8b4cc;
    text-decoration: none;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 6px 20px;
    transition: color 0.2s;
    white-space: nowrap;
    position: relative;
  }

  .nav-link:hover {
    color: #ffffff;
  }

  .nav-link.active {
    color: #f5c518;
  }

  /* Dividers between nav items */
  .nav-divider {
    width: 1px;
    height: 18px;
    background: #2a3a5c;
    flex-shrink: 0;
  }

  /* Right controls */
  .right-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Theme toggle button */
  .theme-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #162040;
    border: 2px solid #2a3a5c;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    flex-shrink: 0;
  }

  .theme-btn:hover {
    border-color: #f5c518;
    background: #1d2e52;
  }

  .theme-btn svg {
    width: 18px;
    height: 18px;
    color: #f5c518;
    stroke: #f5c518;
  }

  /* User button */
  .user-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #e6a020;
    border-radius: 50px;
    padding: 6px 14px 6px 6px;
    cursor: pointer;
    transition: background 0.2s;
    border: none;
  }

  .user-btn:hover {
    background: #f5b52a;
  }

  .user-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #c47f10;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
  }

  .user-name {
    font-size: 13px;
    font-weight: 600;
    color: white;
    max-width: 110px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .chevron-icon {
    width: 14px;
    height: 14px;
    stroke: white;
    flex-shrink: 0;
  }

  /* Hover glow effects */
  .nav-link::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 2px;
    background: #f5c518;
    border-radius: 2px;
    transition: width 0.25s ease;
  }

  .nav-link:hover::after,
  .nav-link.active::after {
    width: 60%;
  }

  .nav-link.active::after {
    background: #f5c518;
    width: 60%;
  }
</style>
</head>
<body>

<nav class="navbar-wrapper">

  <!-- Logo -->
  <div class="logo-section">
    <div class="logo-icon">
      <!-- Meezania-style logo SVG -->
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="19" stroke="#1a3a6e" stroke-width="1.5" fill="#eef2ff"/>
        <!-- Balance scale / portfolio icon -->
        <line x1="20" y1="8" x2="20" y2="32" stroke="#1a3a6e" stroke-width="2" stroke-linecap="round"/>
        <line x1="11" y1="14" x2="29" y2="14" stroke="#1a3a6e" stroke-width="2" stroke-linecap="round"/>
        <circle cx="11" cy="18" r="4" stroke="#1a3a6e" stroke-width="1.5" fill="none"/>
        <circle cx="29" cy="18" r="4" stroke="#1a3a6e" stroke-width="1.5" fill="none"/>
        <path d="M16 28 Q20 32 24 28" stroke="#c8a020" stroke-width="2" fill="none" stroke-linecap="round"/>
        <!-- Star/spark top -->
        <polygon points="20,4 21,7 24,7 22,9 23,12 20,10 17,12 18,9 16,7 19,7" fill="#c8a020"/>
      </svg>
    </div>
    <div class="logo-text">
      <span class="portfolio">Portfolio</span>
      <span class="handler">Handler</span>
    </div>
  </div>

  <!-- Nav Links -->
  <div class="nav-links">
    <div class="nav-item">
      <a href="#" class="nav-link">HOME</a>
      <div class="nav-divider"></div>
    </div>
    <div class="nav-item">
      <a href="#" class="nav-link">VISION</a>
      <div class="nav-divider"></div>
    </div>
    <div class="nav-item">
      <a href="#" class="nav-link">TEMPLATES</a>
      <div class="nav-divider"></div>
    </div>
    <div class="nav-item">
      <a href="#" class="nav-link">PRODUCTS</a>
      <div class="nav-divider"></div>
    </div>
    <div class="nav-item">
      <a href="#" class="nav-link">PARTNER</a>
      <div class="nav-divider"></div>
    </div>
    <div class="nav-item">
      <a href="#" class="nav-link active">ABOUT</a>
    </div>
  </div>

  <!-- Right Controls -->
  <div class="right-controls">
    <!-- Theme toggle -->
    <button class="theme-btn" title="Toggle theme">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
    </button>

    <!-- User -->
    <button class="user-btn">
      <div class="user-avatar">T</div>
      <span class="user-name">tauheeddeveloper13...</span>
      <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>
  </div>

</nav>

</body>
</html>
