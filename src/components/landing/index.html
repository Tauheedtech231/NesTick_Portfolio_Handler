<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0B0F19; font-family: Arial, sans-serif; }
  @keyframes tw-blink { 0%,100%{opacity:1} 50%{opacity:0} }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const { useState, useEffect, useRef, useCallback } = React;

const NUM_SEGS = 5, BOTTOM_GAP = 2;
const SEG_SPAN = 360 / NUM_SEGS - BOTTOM_GAP, START_OFFSET = 270;

const SEG_META = [
  { id:"01", label:["MULTI","PORTAL"], title:"MULTI-PORTAL ARCHITECTURE", description:"Build and manage multiple portals from a single codebase with shared components. Scale seamlessly across brands, regions, and user types without duplicating your infrastructure." },
  { id:"02", label:["CENTRALIZ"], title:"CENTRALIZED MANAGEMENT", description:"Control all your portals, users, and configurations from one unified dashboard. Streamline operations and reduce overhead with a single source of truth for your entire platform." },
  { id:"03", label:["ACCESS","CONTROL"], title:"ACCESS CONTROL", description:"Define granular roles and permissions for every user across all portals. Protect sensitive data with enterprise-grade authentication and fine-grained authorization policies." },
  { id:"04", label:["LIVE","SYNC"], title:"LIVE SYNC", description:"Real-time data synchronization across all portals and devices. Changes propagate instantly so every user always sees the most current information without manual refresh." },
  { id:"05", label:["PORTFOLIO"], title:"PORTFOLIO", description:"Showcase and manage your complete portfolio of projects within one cohesive platform. Present clients with a polished, branded experience that highlights your best work." },
];

const CX=340, CY=340, GOLD="#FFD700";
const FILL="#0f1e38", FILL_HOVER="#1a3060", INNER_FILL="#07101e";
const OUTER_R=320, STRIP_OUTER=320, STRIP_INNER=294;
const SEG_OUTER=278, SEG_INNER=130, INNER_CIRCLE_R=116;
const LABEL_R=206, NUM_R=(STRIP_OUTER+STRIP_INNER)/2;
const FLY_SIZE=300;

const toRad = d => d*Math.PI/180;
const polar = (r,deg,cx=CX,cy=CY) => ({ x: cx+r*Math.cos(toRad(deg)), y: cy+r*Math.sin(toRad(deg)) });

function arcPath(r,s,e,cx=CX,cy=CY){
  let end=e; if(end<s) end+=360;
  const lg=end-s>180?1:0, a=polar(r,s,cx,cy), b=polar(r,e,cx,cy);
  return `M ${a.x} ${a.y} A ${r} ${r} 0 ${lg} 1 ${b.x} ${b.y}`;
}
function donutSeg(oR,iR,s,e,cx=CX,cy=CY){
  let end=e; if(end<s) end+=360;
  const lg=end-s>180?1:0;
  const os=polar(oR,s,cx,cy),oe=polar(oR,e,cx,cy),ie=polar(iR,e,cx,cy),is_=polar(iR,s,cx,cy);
  return `M ${os.x} ${os.y} A ${oR} ${oR} 0 ${lg} 1 ${oe.x} ${oe.y} L ${ie.x} ${ie.y} A ${iR} ${iR} 0 ${lg} 0 ${is_.x} ${is_.y} Z`;
}

// easeInOutCubic — smoother than quad, physical feel
function ease(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

function computeVB(s,e,oR=278,iR=130,cx=340,cy=340,pad=14){
  const toR=d=>d*Math.PI/180; let end=e; if(end<s) end+=360;
  const pts=[];
  for(let d=s;d<=end;d+=2){ const a=toR(d); pts.push([cx+oR*Math.cos(a),cy+oR*Math.sin(a)],[cx+iR*Math.cos(a),cy+iR*Math.sin(a)]); }
  for(let d=s;d<=end;d+=2){ const a=toR(d); pts.push([cx+320*Math.cos(a),cy+320*Math.sin(a)],[cx+294*Math.cos(a),cy+294*Math.sin(a)]); }
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const minX=Math.min(...xs)-pad,minY=Math.min(...ys)-pad,maxX=Math.max(...xs)+pad,maxY=Math.max(...ys)+pad;
  return `${minX.toFixed(0)} ${minY.toFixed(0)} ${(maxX-minX).toFixed(0)} ${(maxY-minY).toFixed(0)}`;
}

function calcSegments(){
  return Array.from({length:NUM_SEGS},(_,i)=>{
    const segAngle=360/NUM_SEGS, centerDeg=(START_OFFSET+i*segAngle)%360;
    const half=SEG_SPAN/2, startDeg=(centerDeg-half+360)%360;
    const endDeg=((centerDeg+half)%360-BOTTOM_GAP+360)%360;
    return {...SEG_META[i], startDeg, endDeg, centerDeg, index:i, vb:computeVB(startDeg,endDeg)};
  });
}
const SEGMENTS=calcSegments();

function useTypewriter(text,speed=16,delay=400){
  const [displayed,setDisplayed]=useState(""), [done,setDone]=useState(false);
  const t=useRef(null);
  useEffect(()=>{
    setDisplayed(""); setDone(false); let i=0;
    t.current=setTimeout(()=>{
      const tick=()=>{ i++; setDisplayed(text.slice(0,i)); if(i<text.length) t.current=setTimeout(tick,speed); else setDone(true); };
      tick();
    },delay);
    return ()=>clearTimeout(t.current);
  },[text]);
  return {displayed,done};
}

function SegPaths({seg,fill,innerFill,color,sw=2}){
  const np=polar(NUM_R,seg.centerDeg), lp=polar(LABEL_R,seg.centerDeg);
  return React.createElement(React.Fragment,null,
    React.createElement('path',{d:arcPath(OUTER_R,seg.startDeg,seg.endDeg),fill:"none",stroke:color,strokeWidth:sw}),
    React.createElement('path',{d:donutSeg(STRIP_OUTER,STRIP_INNER,seg.startDeg,seg.endDeg),fill:innerFill,stroke:color,strokeWidth:sw}),
    React.createElement('path',{d:arcPath(STRIP_INNER,seg.startDeg,seg.endDeg),fill:"none",stroke:color,strokeWidth:sw}),
    React.createElement('path',{d:donutSeg(SEG_OUTER,SEG_INNER,seg.startDeg,seg.endDeg),fill,stroke:color,strokeWidth:sw}),
    React.createElement('path',{d:arcPath(SEG_OUTER,seg.startDeg,seg.endDeg),fill:"none",stroke:color,strokeWidth:sw}),
    React.createElement('path',{d:arcPath(SEG_INNER,seg.startDeg,seg.endDeg),fill:"none",stroke:color,strokeWidth:sw}),
    React.createElement('text',{x:np.x,y:np.y,textAnchor:"middle",dominantBaseline:"central",fill:color,fontFamily:"Arial,sans-serif",fontSize:"13",fontWeight:"700",letterSpacing:"1.5"},seg.id),
    ...seg.label.map((line,i)=>React.createElement('text',{key:i,x:lp.x,y:lp.y+(i-(seg.label.length-1)/2)*21,textAnchor:"middle",dominantBaseline:"central",fill:color,fontFamily:"Arial,sans-serif",fontSize:"14",fontWeight:"700",letterSpacing:"2.5"},line))
  );
}

function InfoPanel({seg,visible}){
  const {displayed,done}=useTypewriter(seg.description);
  return React.createElement('div',{style:{opacity:visible?1:0,transition:"opacity 0.5s ease",maxWidth:320}},
    React.createElement('div',{style:{display:"flex",alignItems:"flex-start",gap:10,marginBottom:16}},
      React.createElement('span',{style:{flexShrink:0,marginTop:5,width:10,height:10,borderRadius:"50%",backgroundColor:GOLD}}),
      React.createElement('p',{style:{color:GOLD,fontFamily:"Arial,sans-serif",fontSize:15,fontWeight:700,letterSpacing:1,lineHeight:1.45,margin:0}},seg.title)
    ),
    React.createElement('div',{style:{display:"flex",alignItems:"flex-start",gap:10}},
      React.createElement('span',{style:{flexShrink:0,marginTop:7,width:7,height:7,borderRadius:"50%",backgroundColor:GOLD,opacity:0.5}}),
      React.createElement('p',{style:{color:"#D1D5DB",fontFamily:"Arial,sans-serif",fontSize:13.5,lineHeight:1.78,margin:0,minHeight:80}},
        displayed,
        !done&&React.createElement('span',{style:{display:"inline-block",width:2,height:13,backgroundColor:GOLD,marginLeft:2,verticalAlign:"middle",animation:"tw-blink 0.75s step-end infinite"}})
      )
    )
  );
}

function App(){
  const [activeSeg,setActiveSeg]=useState(null);
  const [showInfo,setShowInfo]=useState(false);
  const [animating,setAnimating]=useState(false);
  const [hoveredId,setHoveredId]=useState(null);
  const [wheelReady,setWheelReady]=useState(false);
  // fly state: { left, top, scale }
  const [fly,setFly]=useState(null);

  const wheelRef=useRef(null), containerRef=useRef(null), rafRef=useRef(null), startRef=useRef(null);
  // store start/end positions for both journeys
  const journeyRef=useRef(null);

  useEffect(()=>{ const t=setTimeout(()=>setWheelReady(true),120); return ()=>clearTimeout(t); },[]);

  // Get the segment's center position in container-local coords
  // and compute the "natural" scale it should appear at when sitting in the wheel
  function getSlotInfo(seg){
    const wEl=wheelRef.current, cEl=containerRef.current;
    if(!wEl||!cEl) return null;
    const wRect=wEl.getBoundingClientRect(), cRect=cEl.getBoundingClientRect();
    const svgScale=wRect.width/680;
    const midR=(SEG_OUTER+SEG_INNER)/2;
    const rad=toRad(seg.centerDeg);
    // segment center in container coords
    const slotCx=(wRect.left-cRect.left)+(CX+midR*Math.cos(rad))*svgScale;
    const slotCy=(wRect.top-cRect.top)+(CY+midR*Math.sin(rad))*svgScale;
    // how big the segment visually is in the wheel vs FLY_SIZE
    const segVisualWidth=(SEG_OUTER-SEG_INNER)*svgScale;
    const slotScale=segVisualWidth/FLY_SIZE*1.9; // tweak factor for visual match
    return { slotCx, slotCy, slotScale, cRect };
  }

  const handleClick=useCallback((seg)=>{
    if(animating||activeSeg) return;
    const info=getSlotInfo(seg);
    if(!info) return;
    const {slotCx,slotCy,slotScale,cRect}=info;

    // flying div top-left when centred over slot
    const startLeft=slotCx-FLY_SIZE/2;
    const startTop=slotCy-FLY_SIZE/2;
    // landing position: left side, vertically centred
    const endLeft=cRect.width*0.03;
    const endTop=cRect.height*0.5-FLY_SIZE/2;

    journeyRef.current={startLeft,startTop,startScale:slotScale,endLeft,endTop};

    setFly({left:startLeft,top:startTop,scale:slotScale,seg});
    setActiveSeg(seg);
    setAnimating(true);
    setShowInfo(false);

    const DUR=1400; startRef.current=null;
    const go=ts=>{
      if(startRef.current===null) startRef.current=ts;
      const raw=Math.min((ts-startRef.current)/DUR,1);
      const t=ease(raw);
      const left=startLeft+(endLeft-startLeft)*t;
      const top=startTop+(endTop-startTop)*t - 36*Math.sin(raw*Math.PI);
      // scale: from slotScale → 1 (grows as it flies out)
      const scale=slotScale+(1-slotScale)*t;
      setFly(prev=>({...prev,left,top,scale}));
      if(raw<1){ rafRef.current=requestAnimationFrame(go); }
      else{
        setFly(prev=>({...prev,left:endLeft,top:endTop,scale:1}));
        setAnimating(false);
        setTimeout(()=>setShowInfo(true),150);
      }
    };
    rafRef.current=requestAnimationFrame(go);
  },[animating,activeSeg]);

  const handleClose=useCallback(()=>{
    if(animating||!activeSeg) return;
    setShowInfo(false);
    const j=journeyRef.current;
    if(!j){ setActiveSeg(null); setFly(null); return; }
    const {startLeft,startTop,startScale,endLeft,endTop}=j;

    if(rafRef.current) cancelAnimationFrame(rafRef.current);
    setAnimating(true);
    startRef.current=null;

    const DUR=1400;
    // We animate LEFT+TOP (position) AND SCALE simultaneously
    // scale goes 1 → slotScale so it "shrinks into" the slot naturally
    const go=ts=>{
      if(startRef.current===null) startRef.current=ts;
      const raw=Math.min((ts-startRef.current)/DUR,1);
      const t=ease(raw);
      const left=endLeft+(startLeft-endLeft)*t;
      const top=endTop+(startTop-endTop)*t;
      // KEY: scale shrinks smoothly from 1 back to slotScale
      const scale=1+(startScale-1)*t;
      setFly(prev=>({...prev,left,top,scale}));
      if(raw<1){ rafRef.current=requestAnimationFrame(go); }
      else{
        // snap complete: hide flying div, reveal wheel segment
        setAnimating(false);
        setActiveSeg(null);
        setFly(null);
      }
    };
    rafRef.current=requestAnimationFrame(go);
  },[animating,activeSeg]);

  useEffect(()=>{ const f=e=>{ if(e.key==="Escape") handleClose(); }; window.addEventListener("keydown",f); return ()=>window.removeEventListener("keydown",f); },[handleClose]);

  return React.createElement('section',{
    ref:containerRef,
    style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
      width:"100%",minHeight:"100vh",padding:"60px 16px",
      backgroundColor:"#0B0F19",boxSizing:"border-box",position:"relative",overflow:"hidden"}
  },
    React.createElement('style',null,`@keyframes tw-blink{0%,100%{opacity:1}50%{opacity:0}}`),

    // Header
    React.createElement('div',{style:{textAlign:"center",marginBottom:40}},
      React.createElement('h2',{style:{fontFamily:"'Poppins',Arial,sans-serif",fontSize:"clamp(22px,3.5vw,34px)",fontWeight:700,letterSpacing:"-0.3px",margin:0}},
        React.createElement('span',{style:{color:"#FFFFFF"}},"Comprehensive")," ",
        React.createElement('span',{style:{color:GOLD}},"System Features")
      ),
      React.createElement('p',{style:{marginTop:8,fontSize:13,color:"#9CA3AF",letterSpacing:1}},"Explore our powerful platform capabilities"),
      React.createElement('div',{style:{margin:"12px auto 0",height:2,width:160,backgroundColor:GOLD,opacity:0.6}})
    ),

    // Wheel
    React.createElement('div',{
      ref:wheelRef,
      style:{width:"100%",maxWidth:520,position:"relative",
        opacity:wheelReady?1:0,
        transform:wheelReady?"translateY(0) scale(1)":"translateY(28px) scale(0.97)",
        transition:wheelReady?"opacity 1.1s ease,transform 1.5s ease":"none"}
    },
      React.createElement('svg',{width:"100%",viewBox:"0 0 680 680",xmlns:"http://www.w3.org/2000/svg"},
        ...SEGMENTS.map(seg=>{
          const isActive=activeSeg&&activeSeg.id===seg.id;
          const isHov=hoveredId===seg.id&&!activeSeg;
          return React.createElement('g',{
            key:seg.id,
            onClick:()=>!activeSeg&&!animating&&handleClick(seg),
            onMouseEnter:()=>!activeSeg&&setHoveredId(seg.id),
            onMouseLeave:()=>setHoveredId(null),
            style:{
              cursor:activeSeg?"default":"pointer",
              opacity:isActive?0.12:1,
              transition:"opacity 0.25s ease",
              transform:isHov&&!activeSeg?"scale(1.015)":"scale(1)",
              transformOrigin:`${CX}px ${CY}px`,
              transitionProperty:"opacity,transform",
              transitionDuration:"0.25s,0.15s",
              pointerEvents:activeSeg?"none":"auto",
            }
          },
            React.createElement(SegPaths,{seg,fill:isHov?FILL_HOVER:FILL,innerFill:INNER_FILL,color:GOLD,sw:isHov?2.2:2})
          );
        }),
        React.createElement('circle',{cx:CX,cy:CY,r:INNER_CIRCLE_R,fill:INNER_FILL,stroke:GOLD,strokeWidth:"2"}),
        React.createElement('text',{x:CX,y:CY,textAnchor:"middle",dominantBaseline:"central",fill:GOLD,fontFamily:"Arial,sans-serif",fontSize:"22",fontWeight:"700",letterSpacing:"3"},"Neezamiya")
      )
    ),

    // Dim overlay — z:10, does NOT cover flying segment (z:20)
    activeSeg&&React.createElement('div',{
      onClick:handleClose,
      style:{position:"absolute",inset:0,zIndex:10,backgroundColor:"rgba(0,0,0,0.6)",
        transition:"background-color 0.4s ease",pointerEvents:animating?"none":"auto"}
    }),

    // Info panel — z:30
    activeSeg&&React.createElement('div',{
      onClick:e=>e.stopPropagation(),
      style:{position:"absolute",right:"8%",top:"50%",transform:"translateY(-50%)",
        width:320,maxWidth:"28vw",zIndex:30,pointerEvents:animating?"none":"auto"}
    },
      React.createElement(InfoPanel,{seg:activeSeg,visible:showInfo})
    ),

    // Close button — z:40
    activeSeg&&React.createElement('button',{
      onClick:e=>{e.stopPropagation();handleClose();},
      style:{position:"absolute",top:20,right:28,background:"transparent",border:"none",
        cursor:"pointer",color:GOLD,fontSize:38,lineHeight:1,zIndex:40,
        opacity:showInfo&&!animating?1:0,transition:"opacity 0.4s ease",
        pointerEvents:showInfo&&!animating?"auto":"none"}
    },"×"),

    // Flying segment — z:20, above overlay, below info panel
    // transformOrigin at FLY_SIZE/2 so scale is centred
    fly&&React.createElement('div',{
      style:{
        position:"absolute",
        left:fly.left, top:fly.top,
        width:FLY_SIZE, height:FLY_SIZE,
        zIndex:20,
        transform:`scale(${fly.scale})`,
        transformOrigin:`${FLY_SIZE/2}px ${FLY_SIZE/2}px`,
        pointerEvents:"none",
        willChange:"transform,left,top",
      }
    },
      React.createElement('svg',{width:FLY_SIZE,height:FLY_SIZE,viewBox:fly.seg.vb,xmlns:"http://www.w3.org/2000/svg"},
        React.createElement(SegPaths,{seg:fly.seg,fill:FILL_HOVER,innerFill:INNER_FILL,color:GOLD,sw:2.5})
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
