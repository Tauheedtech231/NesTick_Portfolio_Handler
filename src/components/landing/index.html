<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Building Digital Futures</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: #000;
    color: #fff;
    overflow-x: hidden;
  }

  .hero {
    min-height: 100vh;
    background: radial-gradient(ellipse at 60% 50%, #0d1a3a 0%, #050810 60%, #000 100%);
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
    padding: 0 6%;
  }

  /* Starfield */
  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 30%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 25%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 8%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 20%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 75%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 65%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 45%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 5% 85%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 90%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 60% 80%, rgba(100,160,255,0.7) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 45% 55%, rgba(100,160,255,0.5) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 80% 35%, rgba(100,160,255,0.6) 0%, transparent 100%);
    pointer-events: none;
  }

  /* Left content */
  .left {
    flex: 0 0 42%;
    position: relative;
    z-index: 2;
  }

  .about-label {
    display: flex;
    align-items: center;
    gap: 10px;
    color: rgba(255,255,255,0.5);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  .about-label::before {
    content: '';
    width: 3px;
    height: 16px;
    background: rgba(255,255,255,0.4);
    border-radius: 2px;
  }

  .headline {
    font-size: clamp(42px, 5.5vw, 72px);
    font-weight: 800;
    line-height: 1.05;
    margin-bottom: 10px;
  }

  .headline .white { color: #fff; }
  .headline .gold { color: #f5a623; }
  .headline .blue { color: #4da6ff; }

  .since {
    display: flex;
    align-items: center;
    gap: 12px;
    color: rgba(255,255,255,0.45);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin: 18px 0 28px;
  }

  .since::before,
  .since::after {
    content: '';
    flex: 1;
    max-width: 40px;
    height: 1px;
    background: rgba(255,255,255,0.3);
  }

  .since span { white-space: nowrap; }

  .description {
    color: rgba(255,255,255,0.6);
    font-size: 14.5px;
    line-height: 1.7;
    max-width: 380px;
    margin-bottom: 44px;
  }

  .description .highlight {
    color: #f5a623;
    font-weight: 600;
    font-style: italic;
  }

  /* Stats */
  .stats {
    display: flex;
    gap: 36px;
    margin-bottom: 44px;
  }

  .stat-item { display: flex; flex-direction: column; }

  .stat-icon {
    width: 28px;
    height: 28px;
    margin-bottom: 8px;
    opacity: 0.8;
  }

  .stat-number {
    font-size: 28px;
    font-weight: 800;
    color: #f5a623;
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    line-height: 1.4;
  }

  /* CTA Button */
  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
  }

  .cta-text {
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
  }

  .cta-arrow {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }

  .cta-btn:hover .cta-arrow {
    background: rgba(255,255,255,0.2);
    transform: translateX(3px);
  }

  .cta-arrow svg { width: 14px; height: 14px; color: #fff; }

  /* Right - orbital diagram */
  .right {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    z-index: 1;
  }

  .orbital-container {
    position: relative;
    width: 500px;
    height: 500px;
  }

  /* Orbital rings */
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.07);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .ring-1 { width: 160px; height: 160px; border-color: rgba(255,200,80,0.3); }
  .ring-2 { width: 270px; height: 270px; border-style: dashed; border-color: rgba(255,255,255,0.1); }
  .ring-3 { width: 390px; height: 390px; border-color: rgba(255,255,255,0.07); }
  .ring-4 { width: 490px; height: 490px; border-color: rgba(255,255,255,0.04); }

  /* Core planet */
  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #4da6ff 0%, #1a3a7a 40%, #0a1535 70%, #050a1a 100%);
    box-shadow:
      0 0 40px rgba(77,166,255,0.4),
      0 0 80px rgba(77,166,255,0.15),
      inset 0 0 30px rgba(0,0,50,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }

  /* N logo */
  .n-logo {
    font-size: 42px;
    font-weight: 900;
    background: linear-gradient(135deg, #4da6ff, #f5a623, #fff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-style: italic;
  }

  /* Golden glow arc on left side of core */
  .core::before {
    content: '';
    position: absolute;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 3px solid transparent;
    border-left-color: #f5a623;
    border-bottom-color: rgba(245,166,35,0.3);
    transform: rotate(-30deg);
    box-shadow: -4px 4px 20px rgba(245,166,35,0.6);
  }

  /* Orbital feature nodes */
  .node {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 6;
  }

  .node-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(10,20,50,0.9);
    border: 1px solid rgba(77,166,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 15px rgba(77,166,255,0.2);
  }

  .node-icon svg {
    width: 20px;
    height: 20px;
    stroke: #4da6ff;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .node-label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    text-align: center;
    line-height: 1.4;
  }

  /* Top - Smart Portfolios */
  .node-top {
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
  }

  /* Left - Secure & Reliable */
  .node-left {
    top: 50%;
    left: 30px;
    transform: translateY(-50%);
  }

  /* Right - Data Driven Insights */
  .node-right {
    top: 50%;
    right: 10px;
    transform: translateY(-50%);
  }

  /* Bottom - Global Presence */
  .node-bottom {
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
  }

  /* Dot accents on rings */
  .dot {
    position: absolute;
    border-radius: 50%;
    background: #f5a623;
    box-shadow: 0 0 8px rgba(245,166,35,0.8);
  }

  .dot-1 { width: 6px; height: 6px; top: 50%; left: -3px; margin-top: -3px; }
  .dot-blue {
    width: 5px;
    height: 5px;
    background: #4da6ff;
    box-shadow: 0 0 8px rgba(77,166,255,0.8);
    border-radius: 50%;
    position: absolute;
  }

  /* Large curved arc line on left side (the big swooping curve) */
  .arc-svg {
    position: absolute;
    top: 50%;
    left: -3%;
    transform: translateY(-50%);
    width: 55%;
    height: 110%;
    pointer-events: none;
    z-index: 1;
  }

  /* Bottom gradient fade */
  .hero::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 120px;
    background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
    pointer-events: none;
  }

  /* Floating blue dots scattered */
  .float-dot {
    position: absolute;
    border-radius: 50%;
    background: #4da6ff;
    box-shadow: 0 0 6px rgba(77,166,255,0.9);
    pointer-events: none;
  }
</style>
</head>
<body>

<section class="hero">
  <!-- Stars background -->
  <div class="stars"></div>

  <!-- Floating dots -->
  <div class="float-dot" style="width:4px;height:4px;top:18%;left:48%;opacity:0.8;"></div>
  <div class="float-dot" style="width:3px;height:3px;top:32%;left:52%;opacity:0.6;"></div>
  <div class="float-dot" style="width:4px;height:4px;top:72%;left:44%;opacity:0.7;"></div>
  <div class="float-dot" style="width:3px;height:3px;top:55%;left:57%;opacity:0.5;"></div>
  <div class="float-dot" style="width:5px;height:5px;top:80%;left:60%;opacity:0.6;background:#f5a623;box-shadow:0 0 8px rgba(245,166,35,0.9);"></div>

  <!-- Left Content -->
  <div class="left">
    <div class="about-label">About Us</div>

    <div class="headline">
      <div class="white">Building</div>
      <div>
        <span class="gold">Digital </span><span class="blue">Futures</span>
      </div>
    </div>

    <div class="since">
      <span>Since 2021</span>
    </div>

    <p class="description">
      We empower institutions to manage and showcase student portfolios —
      <span class="highlight">simply, securely and efficiently.</span>
    </p>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-item">
        <!-- Institution icon -->
        <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(245,166,35,0.8)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M8 10v11M12 10v11M16 10v11M20 10v11"/>
        </svg>
        <div class="stat-number">500+</div>
        <div class="stat-label">Institutions<br>Trust Us</div>
      </div>

      <div class="stat-item">
        <!-- People icon -->
        <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(245,166,35,0.8)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <div class="stat-number">1M+</div>
        <div class="stat-label">Students<br>Impacted</div>
      </div>

      <div class="stat-item">
        <!-- Globe icon -->
        <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(162,100,255,0.8)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <div class="stat-number" style="color:#a264ff;">20+</div>
        <div class="stat-label">Countries<br>Reached</div>
      </div>
    </div>

    <!-- CTA -->
    <button class="cta-btn">
      <span class="cta-text">Explore Our Solutions</span>
      <div class="cta-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
        </svg>
      </div>
    </button>
  </div>

  <!-- Right - Orbital Diagram -->
  <div class="right">

    <!-- Big swooping arc SVG in background -->
    <svg class="arc-svg" viewBox="0 0 300 600" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 280 0 Q 0 300 280 600" stroke="rgba(77,100,255,0.15)" stroke-width="1.5" fill="none"/>
      <path d="M 260 0 Q -30 300 260 600" stroke="rgba(100,80,255,0.08)" stroke-width="1" fill="none"/>
    </svg>

    <div class="orbital-container">
      <!-- Rings -->
      <div class="ring ring-4">
        <div class="dot-blue" style="top:15%;left:72%;width:4px;height:4px;"></div>
        <div class="dot-blue" style="top:82%;left:20%;width:3px;height:3px;"></div>
      </div>
      <div class="ring ring-3">
        <div class="dot-blue" style="top:5%;left:55%;width:4px;height:4px;"></div>
      </div>
      <div class="ring ring-2">
        <div class="dot dot-1"></div>
      </div>
      <div class="ring ring-1"></div>

      <!-- Core -->
      <div class="core">
        <span class="n-logo">N</span>
      </div>

      <!-- Top node: Smart Portfolios -->
      <div class="node node-top">
        <div class="node-icon">
          <svg viewBox="0 0 24 24">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <div class="node-label">Smart<br>Portfolios</div>
      </div>

      <!-- Left node: Secure & Reliable -->
      <div class="node node-left">
        <div class="node-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div class="node-label">Secure &<br>Reliable</div>
      </div>

      <!-- Right node: Data Driven Insights -->
      <div class="node node-right">
        <div class="node-icon">
          <svg viewBox="0 0 24 24">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
            <polyline points="3 7 7 3 11 7 15 3 19 7"/>
          </svg>
        </div>
        <div class="node-label">Data Driven<br>Insights</div>
      </div>

      <!-- Bottom node: Global Presence -->
      <div class="node node-bottom">
        <div class="node-icon">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
        </div>
        <div class="node-label">Global<br>Presence</div>
      </div>

    </div>
  </div>

</section>

</body>
</html>
