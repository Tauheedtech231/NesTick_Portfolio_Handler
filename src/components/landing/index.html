<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hand-Drawn Sketch Reproduction</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-layout-styles">
    /* 
       Applying a subtle paper-like texture to the background 
       to match the organic feel of the original sketch.
    */
    body {
      background-color: #f0f0ee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-image: 
        radial-gradient(#d1d1cf 1px, transparent 0),
        radial-gradient(#d1d1cf 1px, transparent 0);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      background-attachment: fixed;
    }

    /* Container for the SVG to maintain proportions */
    .sketch-container {
      width: 100%;
      max-width: 550px;
      padding: 3rem;
      background: #fafafa;
      box-shadow: 
        0 10px 25px -5px rgba(0, 0, 0, 0.1),
        0 8px 10px -6px rgba(0, 0, 0, 0.1),
        inset 0 0 100px rgba(0,0,0,0.02);
      border-radius: 4px;
      position: relative;
      border: 1px solid #e5e5e2;
    }

    /* Shaky line animation simulation or just irregular pathing */
    .sketch-path {
        filter: url(#roughness);
    }
</style>
</head>
<body>
<!-- BEGIN: SketchWrapper -->
<main class="sketch-container" data-purpose="sketch-main-content">
<!-- 
      The SVG recreates the hand-drawn organic shapes. 
      Using 'stroke-linejoin="round"' and 'stroke-linecap="round"' 
      to mimic the ink flow of a pen.
    -->
<svg class="w-full h-auto" data-purpose="organic-sketch-drawing" viewbox="0 0 436 397" xmlns="http://www.w3.org/2000/svg">
<!-- Roughness filter for hand-drawn effect -->
<defs>
<filter id="roughness">
<feturbulence basefrequency="0.03" numoctaves="3" result="noise" type="fractalNoise"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="2"></fedisplacementmap>
</filter>
</defs>
<!-- BEGIN: Ink Strokes Group -->
<g class="sketch-path" fill="none" stroke="#121245" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5">
<!-- 1. Top Left Segment -->
<path d="M 135 45 
             C 110 50, 75 110, 65 180 
             C 60 215, 75 240, 105 245
             L 210 200
             L 155 55 
             Z" data-purpose="segment-1"></path>
<!-- 2. Top Right Segment -->
<path d="M 175 42
             C 240 35, 330 65, 385 145
             L 230 185
             L 165 55
             Z" data-purpose="segment-2"></path>
<!-- 3. Bottom Left Segment -->
<path d="M 100 260
             C 110 320, 150 380, 245 385
             L 205 220
             L 105 255
             Z" data-purpose="segment-3"></path>
<!-- 4. Bottom Center/Right Large Segment -->
<path d="M 225 220
             L 270 345
             C 300 330, 330 300, 345 285
             L 305 195
             L 225 210
             Z" data-purpose="segment-4"></path>
<!-- 5. Far Right Small Wedge Segment -->
<!-- This is the 5th segment missing from the previous version -->
<path d="M 320 190
             L 360 270
             C 385 240, 395 190, 398 165
             L 325 185
             Z" data-purpose="segment-5-wedge"></path>
</g>
<!-- END: Ink Strokes Group -->
<!-- Small center dot -->
<circle cx="218" cy="205" fill="#121245" r="1.2"></circle>
</svg>
<div class="mt-10 text-center text-gray-400 italic text-xs tracking-wide">
      A faithful reproduction of the original five-segment ink sketch.
    </div>
</main>
<!-- END: SketchWrapper -->
</body></html>
