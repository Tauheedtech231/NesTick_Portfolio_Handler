<div style="background:#0d0518;width:100%;aspect-ratio:625/331;overflow:hidden;position:relative;border-radius:8px;">
<svg width="100%" height="100%" viewBox="0 0 625 331" xmlns="http://www.w3.org/2000/svg" style="display:block;">
<defs>
<linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#ff6a3d"/>
<stop offset="35%" stop-color="#ffd23d"/>
<stop offset="65%" stop-color="#b266ff"/>
<stop offset="100%" stop-color="#8a7dff"/>
</linearGradient>
<linearGradient id="lg2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#c93dff"/>
<stop offset="50%" stop-color="#ff8a3d"/>
<stop offset="100%" stop-color="#7d9fff"/>
</linearGradient>
<radialGradient id="bgGlow" cx="30%" cy="55%" r="60%">
<stop offset="0%" stop-color="#2a1040"/>
<stop offset="100%" stop-color="#0d0518"/>
</radialGradient>
</defs>
<rect x="0" y="0" width="625" height="331" fill="url(#bgGlow)"/>
<g id="spiralGroup" fill="none" stroke-linecap="round">
</g>
<g id="waveGroup" fill="none" stroke-linecap="round">
</g>
</svg>
</div>
<script>
(function(){
  var svg = document.currentScript.previousElementSibling.querySelector('svg');
  var spiralGroup = svg.getElementById('spiralGroup');
  var waveGroup = svg.getElementById('waveGroup');
  var cx = 120, cy = 200;
  var spiralColors = ['#ff6a3d','#ffae3d','#ff8a8a','#c97dff','#8a9fff','#6a7dff'];
  for (var i = 0; i < 9; i++) {
    var r = 18 + i * 13;
    var d = 'M ' + (cx + r) + ' ' + cy + ' ';
    var turns = 1.4;
    var steps = 60;
    for (var s = 1; s <= steps; s++) {
      var t = s / steps;
      var ang = t * turns * 2 * Math.PI;
      var rad = r * (1 - t * 0.85);
      var x = cx + rad * Math.cos(ang);
      var y = cy + rad * Math.sin(ang) * 0.85;
      d += 'L ' + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    }
    var path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', d);
    path.setAttribute('stroke', spiralColors[i % spiralColors.length]);
    path.setAttribute('stroke-width', '1.2');
    path.setAttribute('opacity', 0.35 + (i % 3) * 0.15);
    spiralGroup.appendChild(path);
  }

  var waveColors = ['#ff6a3d','#ff8a3d','#ffd23d','#ffb3a3','#c97dff','#a37dff','#8a9fff','#7dbfff','#b3d9ff'];
  var baseCount = 16;
  var paths = [];
  for (var i = 0; i < baseCount; i++) {
    var path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('stroke', waveColors[i % waveColors.length]);
    path.setAttribute('stroke-width', '1.3');
    path.setAttribute('opacity', '0.75');
    waveGroup.appendChild(path);
    paths.push(path);
  }

  function buildPath(i, t) {
    var phase = i * 0.35;
    var wobble = Math.sin(t * 1.3 + phase) * 14;
    var startX = 195 + i * 3;
    var startY = 150 - i * 3.5;
    var midX = 330 + Math.sin(t * 0.8 + phase) * 10;
    var midY = 195 - i * 8 + wobble;
    var peakX = 430 + i * 9;
    var peakY = 55 - i * 2 + Math.cos(t * 0.9 + phase) * 12;
    var endX = 600 + i * 1.5;
    var endY = 75 + i * 11 + Math.sin(t * 1.1 + phase) * 10;
    return 'M 205 158 Q ' + startX + ' ' + startY + ', ' + midX + ' ' + midY +
      ' T ' + peakX + ' ' + peakY + ' T ' + endX + ' ' + endY;
  }

  var t0 = 0;
  function animate() {
    t0 += 0.012;
    for (var i = 0; i < paths.length; i++) {
      paths[i].setAttribute('d', buildPath(i, t0));
    }
    requestAnimationFrame(animate);
  }
  animate();
})();
</script>
