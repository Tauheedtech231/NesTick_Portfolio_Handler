<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Particle Wave</title>
<style>
  html, body {
    margin:0; padding:0; overflow:hidden;
    background: radial-gradient(ellipse at 50% 50%, #0d1b3d 0%, #050a1f 70%, #03060f 100%);
    width:100%; height:100%;
  }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let t = 0;

// Bokeh circles (background)
const bokeh = [];
for (let i=0;i<70;i++){
  const hueChoice = Math.random();
  let color;
  if (hueChoice < 0.55) color = 'rgba(90,170,255,';      // blue
  else if (hueChoice < 0.85) color = 'rgba(200,100,255,'; // purple
  else color = 'rgba(255,150,210,';                       // pink
  bokeh.push({
    x: Math.random()*1, y: Math.random()*1,
    r: 4 + Math.random()*22,
    color,
    alpha: 0.15 + Math.random()*0.4,
    speed: 0.05 + Math.random()*0.15
  });
}

function drawBokeh(){
  bokeh.forEach(b=>{
    const x = b.x*W;
    const y = b.y*H + Math.sin(t*0.001*b.speed*10 + b.x*10)*5;
    const grad = ctx.createRadialGradient(x,y,0,x,y,b.r);
    grad.addColorStop(0, b.color + b.alpha + ')');
    grad.addColorStop(1, b.color + '0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x,y,b.r,0,Math.PI*2);
    ctx.fill();
  });
}

// Particle wave ribbon (mesh of dots forming undulating surface)
const COLS = 90;
const ROWS = 14;

function waveY(xRatio, row, time){
  // multiple sine layers create the flowing ribbon look
  const base = Math.sin(xRatio*Math.PI*2.2 + time*0.0006) * 60;
  const base2 = Math.sin(xRatio*Math.PI*4 + time*0.0009 + 1.5) * 18;
  return base + base2;
}

function drawWave(){
  for (let r = 0; r < ROWS; r++){
    const rowT = r/(ROWS-1); // 0..1 across the ribbon thickness
    for (let cIdx = 0; cIdx <= COLS; cIdx++){
      const xRatio = cIdx/COLS;
      const x = xRatio * W;

      const centerY = H*0.5 + waveY(xRatio, r, t);
      // thickness/spread of ribbon varies with sine so it looks like a twisting band
      const spread = (40 + 70*Math.sin(xRatio*Math.PI*2.2 + t*0.0006 + Math.PI/2)) ;
      const y = centerY + (rowT-0.5) * spread;

      // depth fade & dot size based on row position (creates 3D twist illusion)
      const depth = Math.sin(xRatio*Math.PI*2.2 + t*0.0006 + Math.PI/2 + rowT*Math.PI);
      const size = 1.1 + (depth+1)*1.1;
      const alpha = 0.25 + (depth+1)*0.35;

      // color: blue through middle, pink/purple toward right edge highlight
      let r1,g1,b1;
      const pinkMix = Math.max(0, xRatio - 0.65) / 0.35; // pink increases on right side
      r1 = 80 + pinkMix*170;
      g1 = 160 - pinkMix*60;
      b1 = 255;

      ctx.beginPath();
      ctx.fillStyle = `rgba(${r1|0},${g1|0},${b1|0},${Math.min(alpha,0.95)})`;
      ctx.shadowColor = `rgba(${r1|0},${g1|0},${b1|0},0.8)`;
      ctx.shadowBlur = size*2;
      ctx.arc(x, y, size, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.shadowBlur = 0;
}

// occasional bright sparkle stars
const sparkles = [];
for (let i=0;i<40;i++){
  sparkles.push({
    x: Math.random(), y: Math.random(),
    r: 0.5 + Math.random()*1.5,
    phase: Math.random()*Math.PI*2,
    speed: 0.5 + Math.random()*1.5
  });
}
function drawSparkles(){
  sparkles.forEach(s=>{
    const a = 0.3 + 0.5*Math.abs(Math.sin(t*0.002*s.speed + s.phase));
    ctx.beginPath();
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
    ctx.fill();
  });
}

// glowing diagonal light streak (bottom right, like reference image)
function drawStreak(){
  ctx.save();
  const grad = ctx.createLinearGradient(W*0.65, H*1.1, W*1.15, H*0.55);
  grad.addColorStop(0, 'rgba(255,180,220,0)');
  grad.addColorStop(0.5, 'rgba(255,190,225,0.5)');
  grad.addColorStop(1, 'rgba(255,255,255,0.9)');
  ctx.strokeStyle = grad;
  ctx.lineWidth = 6;
  ctx.shadowColor = 'rgba(255,190,225,0.8)';
  ctx.shadowBlur = 25;
  ctx.beginPath();
  ctx.moveTo(W*0.62, H*1.15);
  ctx.lineTo(W*1.2, H*0.45);
  ctx.stroke();
  ctx.restore();
}

function animate(){
  ctx.clearRect(0,0,W,H);

  // background gradient
  const bg = ctx.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,Math.max(W,H)*0.8);
  bg.addColorStop(0,'#0e1f4a');
  bg.addColorStop(0.6,'#081333');
  bg.addColorStop(1,'#03060f');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  drawBokeh();
  drawStreak();
  drawWave();
  drawSparkles();

  t += 16;
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
