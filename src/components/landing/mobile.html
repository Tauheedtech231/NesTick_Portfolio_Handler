<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Trusted Worldwide Section</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for custom colors and fonts -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'deep-navy': '#050a14',
            'glow-blue': '#4cc9f0',
            'card-border': '#1e3a5f',
            'card-bg': 'rgba(10, 25, 47, 0.8)',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="custom-shapes-and-glows">
    /* Hexagon clipping path for the cards */
    .hexagon {
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      transition: all 0.3s ease;
    }

    /* Outer glowing border effect for hexagon cards */
    .hex-container {
      position: relative;
      background: linear-gradient(135deg, #1e3a5f 0%, #4cc9f0 100%);
      padding: 2px; /* This creates the thin border effect */
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      filter: drop-shadow(0 0 8px rgba(76, 201, 240, 0.3));
    }

    /* Specific glow for the central main hexagon */
    .central-hex-glow {
      box-shadow: 0 0 30px rgba(76, 201, 240, 0.15);
    }

    /* Background pattern simulation */
    .bg-dots {
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Layout adjustments for overlapping feel on mobile */
    .stat-card-offset {
      margin-top: -10px;
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="bg-deep-navy text-white min-h-screen font-sans flex flex-col items-center justify-center p-4">
<!-- BEGIN: Background Overlay -->
<div class="fixed inset-0 bg-dots pointer-events-none z-0"></div>
<!-- END: Background Overlay -->
<!-- BEGIN: Main Content Container -->
<main class="relative z-10 w-full max-w-md mx-auto py-12 flex flex-col items-center"><!-- Connection Lines SVG -->
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
  <svg class="w-full h-full opacity-40" viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
        <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
      </filter>
      <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4cc9f0" stop-opacity="0"></stop>
        <stop offset="50%" stop-color="#4cc9f0" stop-opacity="1"></stop>
        <stop offset="100%" stop-color="#4cc9f0" stop-opacity="0"></stop>
      </linearGradient>
    </defs>
    <!-- Path from Central to Clients (Top Left) -->
    <path d="M 200 150 Q 100 150 100 350" stroke="url(#lineGradient)" stroke-width="2" filter="url(#glow)"></path>
    <!-- Path from Central to Active Users (Top Right) -->
    <path d="M 200 150 Q 300 150 300 400" stroke="url(#lineGradient)" stroke-width="2" filter="url(#glow)"></path>
    <!-- Path from Central to Templates (Bottom Left) -->
    <path d="M 200 150 Q 100 250 100 550" stroke="url(#lineGradient)" stroke-width="2" filter="url(#glow)"></path>
    <!-- Path from Central to Success Rate (Bottom Right) -->
    <path d="M 200 150 Q 300 250 300 600" stroke="url(#lineGradient)" stroke-width="2" filter="url(#glow)"></path>
  </svg>
</div>
<!-- Header/Social Icons (Contextual UI) -->
<div class="absolute top-0 right-0 p-4 flex gap-4 text-gray-400">
<svg class="lucide lucide-share-2" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" width="20" xmlns="http://www.w3.org/2000/svg"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.59 13.51 6.83 3.98"></path><path d="m15.41 6.51-6.82 3.98"></path></svg>
<svg class="lucide lucide-download" fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" width="20" xmlns="http://www.w3.org/2000/svg"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg>
</div>
<!-- BEGIN: Central Heading Section -->
<div class="mb-12 relative">
<!-- Decorative light streak -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-1 bg-gradient-to-r from-transparent via-glow-blue/40 to-transparent blur-md"></div>
<div class="hex-container central-hex-glow">
<div class="hexagon bg-deep-navy px-10 py-16 flex items-center justify-center text-center">
<h1 class="text-2xl font-black tracking-widest uppercase leading-tight">
            Trusted<br>Worldwide
          </h1>
</div>
</div>
</div>
<!-- END: Central Heading Section -->
<!-- BEGIN: Stats Grid -->
<div class="grid grid-cols-2 gap-4 w-full px-2" data-purpose="statistics-grid">
<!-- STAT: Clients -->
<div class="flex flex-col items-center">
<div class="hex-container w-36 h-40">
<div class="hexagon bg-card-bg w-full h-full flex flex-col items-center justify-center p-4">
<span class="text-gray-400 text-xs font-medium mb-1">Clients</span>
<span class="text-2xl font-bold mb-2">500+</span>
<!-- Handshake Icon -->
<svg class="text-glow-blue" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M11 20v2"></path><path d="M15 20v2"></path><path d="M7 20v2"></path><path d="M3 20v2"></path><path d="M3 13h18"></path><path d="m11 13 4.5-4.5"></path><path d="m15 13-4.5-4.5"></path><path d="M2 13h1"></path><path d="M21 13h1"></path></svg>
</div>
</div>
</div>
<!-- STAT: Active Users -->
<div class="flex flex-col items-center mt-8">
<div class="hex-container w-36 h-40">
<div class="hexagon bg-card-bg w-full h-full flex flex-col items-center justify-center p-4">
<span class="text-gray-400 text-xs font-medium mb-1">Active Users</span>
<span class="text-2xl font-bold mb-2">20.0K+</span>
<!-- Users Icon -->
<svg class="text-glow-blue" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
</div>
</div>
</div>
<!-- STAT: Templates -->
<div class="flex flex-col items-center -mt-4">
<div class="hex-container w-36 h-40">
<div class="hexagon bg-card-bg w-full h-full flex flex-col items-center justify-center p-4">
<span class="text-gray-400 text-xs font-medium mb-1">Templates</span>
<span class="text-2xl font-bold mb-2">30+</span>
<!-- Files Icon -->
<svg class="text-glow-blue" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M15.5 2H8.6c-.4 0-.8.2-1.1.5-.3.3-.5.7-.5 1.1v12.8c0 .4.2.8.5 1.1.3.3.7.5 1.1.5h10.8c.4 0 .8-.2 1.1-.5.3-.3.5-.7.5-1.1V6.5L15.5 2z"></path><path d="M15 2v5h5"></path><path d="M9 18h10"></path><path d="M9 14h10"></path><path d="M9 10h1"></path></svg>
</div>
</div>
</div>
<!-- STAT: Success Rate -->
<div class="flex flex-col items-center mt-4">
<div class="hex-container w-36 h-40">
<div class="hexagon bg-card-bg w-full h-full flex flex-col items-center justify-center p-4">
<span class="text-gray-400 text-xs font-medium mb-1">Success Rate</span>
<span class="text-2xl font-bold mb-2">99%</span>
<!-- Up Arrow Icon -->
<svg class="text-glow-blue" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" width="24" xmlns="http://www.w3.org/2000/svg"><path d="m22 7-8.5 8.5-5-5L2 17"></path><polyline points="16 7 22 7 22 13"></polyline></svg>
</div>
</div>
</div>
</div>
<!-- END: Stats Grid -->
<!-- Decorative background element for world map feel -->
<div class="mt-8 opacity-20 select-none pointer-events-none">
<svg class="text-gray-600" fill="currentColor" height="100" viewBox="0 0 200 100" width="200">
<circle cx="20" cy="30" r="1.5"></circle><circle cx="50" cy="20" r="1.5"></circle><circle cx="80" cy="40" r="1.5"></circle><circle cx="110" cy="25" r="1.5"></circle><circle cx="140" cy="50" r="1.5"></circle><circle cx="170" cy="35" r="1.5"></circle>
<circle cx="30" cy="60" r="1.5"></circle><circle cx="60" cy="75" r="1.5"></circle><circle cx="95" cy="65" r="1.5"></circle><circle cx="130" cy="80" r="1.5"></circle><circle cx="160" cy="70" r="1.5"></circle>
</svg>
</div>
</main>
<!-- END: Main Content Container -->


</body></html>
